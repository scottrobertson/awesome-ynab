name: Check links

on:
  schedule:
    # Every Monday at 08:00 UTC.
    - cron: "0 8 * * 1"
  workflow_dispatch:

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 26
      - run: node .github/scripts/check-links.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
